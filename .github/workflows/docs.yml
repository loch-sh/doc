name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCS_URL: ${{ vars.DOCS_URL || 'https://docs.loch.sh' }}
  DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL || '/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # last update dates come from the git history
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g corepack && corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn build # fails on broken links and anchors
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build

  # GitHub Pages. Set the custom domain in Settings > Pages,
  # or DOCS_URL / DOCS_BASE_URL repository variables (e.g. /doc/).
  pages:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Self-hosted image (nginx) on ghcr.io.
  image:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            DOCS_URL=${{ env.DOCS_URL }}
            DOCS_BASE_URL=${{ env.DOCS_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
