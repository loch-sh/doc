server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css text/markdown application/javascript application/json;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;

    # add_header in a location drops the server-level ones, hence the include in each block.
    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build assets
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Markdown copies of each page (llms.txt links point to them)
    location ~* \.md$ {
        types {}
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /fr/ {
        try_files $uri $uri/ =404;
        error_page 404 /fr/404.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
}
